[project]
name = "agent-relay-quality"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
quality = [
  "coverage==7.16.0",
  "defusedxml==0.7.1",
  "hypothesis==6.167.1",
  "lizard==1.24.0",
  "mypy==2.3.1",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "radon==6.0.1",
]
docs = ["mkdocs-material>=9.6,<10", "pillow>=11,<13", "pyyaml>=6,<7", "types-pyyaml>=6,<7", "types-pillow>=10,<13"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "C90", "E4", "E7", "E9", "F", "I", "PIE", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
scripts_are_modules = true
show_error_codes = true
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=scripts/ci",
  "--cov=scripts/docs",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=65",
]
testpaths = ["scripts/ci", "scripts/docs"]

[tool.coverage.run]
omit = ["*/test_*.py"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
