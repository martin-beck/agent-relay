[project]
name = "agent-relay-quality"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
quality = ["lizard==1.24.0", "pre-commit==4.6.2", "radon==6.0.1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "C90", "E4", "E7", "E9", "F", "I", "PIE", "RUF", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
scripts_are_modules = true
show_error_codes = true
strict = true
warn_unreachable = true
