config:
  validation: true
  warningsAsErrors: true

complexity:
  ComplexCondition:
    threshold: 5
  CyclomaticComplexMethod:
    threshold: 21
  LongMethod:
    excludes:
      - "**/test/**"
      - "**/androidTest/**"
    threshold: 120
  LongParameterList:
    constructorThreshold: 9
    excludes:
      - "**/test/**"
      - "**/androidTest/**"
    functionThreshold: 11
    ignoreDefaultParameters: true
  NestedBlockDepth:
    threshold: 5
  TooManyFunctions:
    thresholdInClasses: 32
    thresholdInEnums: 16
    thresholdInFiles: 20
    thresholdInInterfaces: 20
    thresholdInObjects: 20

exceptions:
  TooGenericExceptionCaught:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
      - Test
      - FuzzTest

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    excludeGuardClauses: true
    max: 6
  ThrowsCount:
    max: 3
  UnusedPrivateMember:
    ignoreAnnotated:
      - Preview
  UseCheckOrError:
    active: true
