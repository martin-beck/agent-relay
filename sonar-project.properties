sonar.projectName=Agent Relay
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.exclusions=**/build/**,**/.gradle/**,**/.venv/**,**/src/test/**,**/src/testFixtures/**,**/src/androidTest/**
sonar.tests=.
sonar.test.inclusions=**/src/test/**,**/src/testFixtures/**,**/src/androidTest/**,scripts/ci/test_*.py
sonar.coverage.exclusions=**/src/test/**,**/src/testFixtures/**,**/src/androidTest/**,scripts/ci/test_*.py
sonar.coverage.jacoco.xmlReportPaths=build/reports/kover/report.xml
sonar.kotlin.detekt.reportPaths=build/reports/detekt/detekt.xml

# Deliberately omitted: project key, server URL, organization, and token.
# CI supplies them only after a repository owner explicitly configures the
# trusted SONAR_PROJECT_KEY, SONAR_HOST_URL, and SONAR_TOKEN settings.
