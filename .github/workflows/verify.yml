name: Android verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality, test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate wrapper and set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Test CI support scripts
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: Run static quality checks
        run: ./gradlew spotlessCheck detekt buildHealth --stacktrace

      - name: Run tests and verify coverage
        run: ./gradlew test koverXmlReport koverHtmlReport koverVerify --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug application
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results-${{ github.run_attempt }}
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload quality reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports-${{ github.run_attempt }}
          path: |
            build/reports/dependency-analysis/**
            build/reports/detekt/**
            build/reports/kover/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-reports-${{ github.run_attempt }}
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.sarif
            **/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-relay-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  visual-regression:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate wrapper and set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Verify deterministic UI images
        run: ./gradlew :app:verifyRoborazziDebug --stacktrace

      - name: Upload visual-regression evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-${{ github.run_attempt }}
          path: |
            app/build/outputs/roborazzi/**
            app/build/reports/roborazzi/**
            app/build/test-results/testDebugUnitTest/**
            app/src/test/screenshots/**/*_actual.png
            app/src/test/screenshots/**/*_compare.png
          if-no-files-found: ignore
          retention-days: 14
