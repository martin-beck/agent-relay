name: Android verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality, test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore repository-check environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install repository-check runner
        run: uv sync --locked --only-group quality

      - name: Check every tracked source and document format
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate wrapper and set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Install pinned Android native toolchain
        env:
          CMAKE_ARCHIVE_SHA256: 804d231460ab3c8b556a42d2660af4ac7a0e21c98a7f8ee3318a74b4a9a187a6
          CMAKE_VERSION: 3.28.3
          NDK_VERSION: 28.2.13676358
          NINJA_ARCHIVE_SHA256: b901ba96e486dce377f9a070ed4ef3f79deb45f4ffe2938f8e7ddc69cfb3df77
          NINJA_VERSION: 1.11.1
        run: |
          native_root="$RUNNER_TEMP/agent-relay-native-tools"
          cmake_asset="cmake-$CMAKE_VERSION-linux-x86_64.tar.gz"
          cmake_archive="$native_root/$cmake_asset"
          cmake_url="https://github.com/Kitware/CMake/releases/download/v$CMAKE_VERSION/$cmake_asset"
          ninja_archive="$native_root/ninja-linux.zip"
          ninja_url="https://github.com/ninja-build/ninja/releases/download/v$NINJA_VERSION/ninja-linux.zip"
          mkdir -p "$native_root/cmake" "$native_root/ninja"
          curl --fail --location --retry 3 --proto '=https' \
            --output "$cmake_archive" "$cmake_url"
          curl --fail --location --retry 3 --proto '=https' \
            --output "$ninja_archive" "$ninja_url"
          printf '%s  %s\n' "$CMAKE_ARCHIVE_SHA256" "$cmake_archive" \
            | sha256sum --check --strict
          printf '%s  %s\n' "$NINJA_ARCHIVE_SHA256" "$ninja_archive" \
            | sha256sum --check --strict
          tar -xzf "$cmake_archive" --strip-components=1 -C "$native_root/cmake"
          unzip -q "$ninja_archive" -d "$native_root/ninja"
          chmod 0755 "$native_root/ninja/ninja"
          printf '%s\n' "$native_root/cmake/bin" "$native_root/ninja" >> "$GITHUB_PATH"
          cmake_actual="$("$native_root/cmake/bin/cmake" --version | sed -n '1s/^cmake version //p')"
          test "$cmake_actual" = "$CMAKE_VERSION"
          test "$("$native_root/ninja/ninja" --version)" = "$NINJA_VERSION"
          sdkmanager --install "ndk;$NDK_VERSION"
          ndk_properties="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION/source.properties"
          ndk_actual="$(sed -n 's/^Pkg.Revision = //p' "$ndk_properties")"
          test "$ndk_actual" = "$NDK_VERSION"

      - name: Verify pinned offline speech runtime
        run: ./gradlew :speech:sherpa:buildSherpaAndroidRuntime --stacktrace

      - name: Test CI support scripts
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: Run static quality checks
        run: ./gradlew spotlessCheck detekt buildHealth --stacktrace

      - name: Run tests and verify coverage
        run: ./gradlew test koverXmlReport koverHtmlReport koverVerify --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug application
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results-${{ github.run_attempt }}
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload quality reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports-${{ github.run_attempt }}
          path: |
            build/reports/dependency-analysis/**
            build/reports/detekt/**
            build/reports/kover/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-reports-${{ github.run_attempt }}
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.sarif
            **/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-relay-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  visual-regression:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate wrapper and set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Verify deterministic UI images
        run: ./gradlew :app:verifyRoborazziDebug --stacktrace

      - name: Upload visual-regression evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-${{ github.run_attempt }}
          path: |
            app/build/outputs/roborazzi/**
            app/build/reports/roborazzi/**
            app/build/test-results/testDebugUnitTest/**
            app/src/test/screenshots/**/*_actual.png
            app/src/test/screenshots/**/*_compare.png
          if-no-files-found: ignore
          retention-days: 14
