name: Public contributor validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-contributor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Secret-free disposable checks
    runs-on: agent-relay-public-ci
    timeout-minutes: 20

    steps:
      - name: Check out proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv without shared caches
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.8"
          enable-cache: false

      - name: Install locked repository-check dependencies
        run: uv sync --locked --only-group quality --only-group docs

      - name: Run deterministic Python and policy tests
        run: uv run pytest

      - name: Validate workflow syntax and security policy
        run: |
          uv run pre-commit run ruff-check --all-files
          uv run pre-commit run ruff-format --all-files
          uv run pre-commit run mypy --all-files
          uv run pre-commit run yamllint --all-files
          uv run pre-commit run markdownlint-cli2 --all-files
          uv run pre-commit run check-yaml --all-files
          uv run pre-commit run check-github-workflows --all-files
          uv run pre-commit run check-github-workflows-require-timeout --all-files
          uv run pre-commit run actionlint --all-files
          uv run pre-commit run typos --all-files
          uv run pre-commit run gitleaks --all-files
          uv run pre-commit run zizmor --all-files

      - name: Verify Huawei and MIT source headers
        run: uv run python scripts/ci/verify_source_headers.py

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up isolated Android SDK
        uses: android-actions/setup-android@07976c6290703d34c16d382cb36445f98bb43b1f # v3.2.2
        with:
          packages: ""

      - name: Install required Android toolchain
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          ANDROID_SDKMANAGER_PATH="$(command -v sdkmanager)" \
            scripts/ci/install_android_native_toolchain.sh

      - name: Validate wrapper without shared caches
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Run JVM tests and static Kotlin contracts
        run: ./gradlew spotlessCheck detekt test checkKotlinAbi --stacktrace
