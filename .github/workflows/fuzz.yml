name: JVM fuzzing

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz POSIX command encoding
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate wrapper and set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Run bounded mutation fuzzing
        env:
          JAZZER_FUZZ: "1"
        run: >-
          timeout --signal=TERM 90s
          ./gradlew :ssh:jsch:test
          --tests 'dev.agentrelay.ssh.jsch.PosixCommandEncoderFuzzTest'
          --rerun-tasks
          --stacktrace

      - name: Upload fuzzing evidence and corpus
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jazzer-results-${{ github.run_attempt }}
          path: |
            ssh/jsch/.cifuzz-corpus/**
            ssh/jsch/build/reports/tests/test/**
            ssh/jsch/build/test-results/test/**
          if-no-files-found: error
          retention-days: 14
