name: Android UI verification

on:
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * 1"
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  current-phone:
    name: UI and accessibility (current phone)
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, agent-relay-device-ci]
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.8"
          enable-cache: false

      - name: Install UI verification dependencies
        run: uv sync --locked --only-group quality --only-group docs

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          # The self-hosted temp path is too long for setup-java's GPG agent sockets.
          # setup-java still verifies the vendor-published SHA-256 checksum.
          verify-signature: false

      - name: Validate wrapper and set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Install pinned Android native toolchain
        run: bash scripts/ci/install_android_native_toolchain.sh

      - name: Verify KVM access
        run: |
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Verify dedicated emulator ports and ADB state
        run: |
          if ss -H -ltn "sport = :5582" | grep -q .; then
            echo 'emulator console port 5582 is occupied' >&2
            exit 1
          fi
          if ss -H -ltn "sport = :5583" | grep -q .; then
            echo 'emulator ADB port 5583 is occupied' >&2
            exit 1
          fi
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk_root"
          "$android_sdk_root/platform-tools/adb" devices -l

      - name: Validate Android system-image metadata
        run: |
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk_root"
          system_image="$android_sdk_root/system-images/android-36/default/x86_64"
          source_properties="$system_image/source.properties"
          system_img="$system_image/system.img"
          if [[ ! -s "$source_properties" || ! -s "$system_img" ]]; then
            sdkmanager_path="$android_sdk_root/cmdline-tools/latest/bin/sdkmanager"
            test -x "$sdkmanager_path"
            "$sdkmanager_path" --sdk_root="$android_sdk_root" --uninstall \
              "system-images;android-36;default;x86_64"
            "$sdkmanager_path" --sdk_root="$android_sdk_root" --install \
              "system-images;android-36;default;x86_64" --channel=0
          fi
          test -s "$source_properties"
          test -s "$system_img"

      - name: Run semantic UI and accessibility tests
        env:
          ANDROID_SERIAL: emulator-5582
        run: >-
          EMULATOR_AVD_NAME="test-${{ github.run_id }}-${{ github.run_attempt }}"
          EMULATOR_PORT=5582 bash scripts/ci/run_android_emulator_tests.sh --
          ./gradlew :app:connectedDebugAndroidTest :ssh:android:connectedDebugAndroidTest
          :storage:android:connectedDebugAndroidTest --stacktrace
          bash scripts/ci/verify_background_process_recovery.sh
          app/build/outputs/apk/debug/app-debug.apk
          mkdir -p build/usage-guide/captured
          "$ANDROID_HOME/platform-tools/adb" pull /sdcard/Download/agent-relay-usage-guide/.
          build/usage-guide/captured/

      - name: Verify connected-test evidence
        run: |
          set -o pipefail
          uv run --only-group quality python scripts/ci/verify_connected_tests.py --root . \
            --minimum-tests 33 --minimum-executed 33 \
            --require-module app \
            --require-module ssh/android \
            --require-module storage/android | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify and build app workflow guide
        run: |
          set -o pipefail
          uv run --only-group docs python scripts/docs/render_workflows.py --check
          uv run --only-group docs python scripts/docs/verify_workflows.py \
            --captured build/usage-guide/captured | tee -a "$GITHUB_STEP_SUMMARY"
          uv run --only-group docs mkdocs build --strict
          catalogue_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/WORKFLOWS.md"
          {
            echo "### App workflow guide"
            echo
            echo "- [Browse the workflow catalogue](${catalogue_url})"
            echo "- Download this run's UI evidence artifact for the complete static site."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload UI test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-test-results-current-phone-${{ github.run_attempt }}
          path: |
            **/build/outputs/androidTest-results/connected/**
            **/build/reports/androidTests/connected/**
            build/reports/problems/**
            build/emulator/**
            build/usage-guide/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload browsable usage guide
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usage-guide-site-${{ github.run_attempt }}
          path: build/site
          if-no-files-found: error
          retention-days: 14

      - name: Configure explicitly enabled public Pages
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          vars.ENABLE_PUBLIC_PAGES == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload explicitly enabled public Pages artifact
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          vars.ENABLE_PUBLIC_PAGES == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy-pages:
    name: Publish explicitly enabled public usage guide
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PUBLIC_PAGES == 'true'
    needs: current-phone
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy usage guide
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  extended-matrix:
    name: UI matrix (${{ matrix.name }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, agent-relay-device-ci]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: current-phone
            api-level: 36
            profile: pixel_7_pro
            minimum-tests: 33
            minimum-executed: 33
          - name: minimum-phone
            api-level: 28
            profile: pixel_2
            minimum-tests: 29
            minimum-executed: 29
          - name: current-tablet
            api-level: 36
            profile: pixel_tablet
            minimum-tests: 33
            minimum-executed: 33

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.8"
          enable-cache: false

      - name: Install UI verification dependencies
        run: uv sync --locked --only-group quality

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          # The self-hosted temp path is too long for setup-java's GPG agent sockets.
          # setup-java still verifies the vendor-published SHA-256 checksum.
          verify-signature: false

      - name: Validate wrapper and set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Install pinned Android native toolchain
        run: bash scripts/ci/install_android_native_toolchain.sh

      - name: Verify KVM access
        run: |
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Verify dedicated emulator ports and ADB state
        run: |
          if ss -H -ltn "sport = :5582" | grep -q .; then
            echo 'emulator console port 5582 is occupied' >&2
            exit 1
          fi
          if ss -H -ltn "sport = :5583" | grep -q .; then
            echo 'emulator ADB port 5583 is occupied' >&2
            exit 1
          fi
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk_root"
          "$android_sdk_root/platform-tools/adb" devices -l

      - name: Validate Android system-image metadata
        run: |
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk_root"
          system_image="$android_sdk_root/system-images/android-36/default/x86_64"
          source_properties="$system_image/source.properties"
          system_img="$system_image/system.img"
          if [[ ! -s "$source_properties" || ! -s "$system_img" ]]; then
            sdkmanager_path="$android_sdk_root/cmdline-tools/latest/bin/sdkmanager"
            test -x "$sdkmanager_path"
            "$sdkmanager_path" --sdk_root="$android_sdk_root" --uninstall \
              "system-images;android-36;default;x86_64"
            "$sdkmanager_path" --sdk_root="$android_sdk_root" --install \
              "system-images;android-36;default;x86_64" --channel=0
          fi
          test -s "$source_properties"
          test -s "$system_img"

      - name: Run semantic UI and accessibility tests
        env:
          ANDROID_SERIAL: emulator-5582
        run: >-
          EMULATOR_AVD_NAME="test-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}"
          EMULATOR_PORT=5582 bash scripts/ci/run_android_emulator_tests.sh --
          ./gradlew :app:connectedDebugAndroidTest :ssh:android:connectedDebugAndroidTest
          :storage:android:connectedDebugAndroidTest --stacktrace
          bash scripts/ci/verify_background_process_recovery.sh
          app/build/outputs/apk/debug/app-debug.apk

      - name: Verify connected-test evidence
        run: |
          set -o pipefail
          uv run --only-group quality python scripts/ci/verify_connected_tests.py --root . \
            --minimum-tests ${{ matrix.minimum-tests }} \
            --minimum-executed ${{ matrix.minimum-executed }} \
            --require-module app \
            --require-module ssh/android \
            --require-module storage/android | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload UI test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-test-results-${{ matrix.name }}-${{ github.run_attempt }}
          path: |
            **/build/outputs/androidTest-results/connected/**
            **/build/reports/androidTests/connected/**
            build/reports/problems/**
            build/emulator/**
          if-no-files-found: error
          retention-days: 14
