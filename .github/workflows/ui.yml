name: Android UI verification

on:
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * 1"
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  current-phone:
    name: UI and accessibility (current phone)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate wrapper and set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run semantic UI and accessibility tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            test "$(adb shell getprop sys.boot_completed)" = "1"
            ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Verify connected-test evidence
        run: |
          set -o pipefail
          python3 scripts/ci/verify_connected_tests.py --root . \
            --minimum-tests 18 --minimum-executed 18 \
            --require-module app \
            --require-module ssh/android \
            --require-module storage/android | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload UI test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-test-results-current-phone-${{ github.run_attempt }}
          path: |
            **/build/outputs/androidTest-results/connected/**
            **/build/reports/androidTests/connected/**
            build/reports/problems/**
          if-no-files-found: error
          retention-days: 14

  extended-matrix:
    name: UI matrix (${{ matrix.name }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: current-phone
            api-level: 36
            profile: pixel_7_pro
            minimum-tests: 18
            minimum-executed: 18
          - name: minimum-phone
            api-level: 28
            profile: pixel_2
            minimum-tests: 15
            minimum-executed: 15
          - name: current-tablet
            api-level: 36
            profile: pixel_tablet
            minimum-tests: 18
            minimum-executed: 18

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate wrapper and set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run semantic UI and accessibility tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            test "$(adb shell getprop sys.boot_completed)" = "1"
            ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Verify connected-test evidence
        run: |
          set -o pipefail
          python3 scripts/ci/verify_connected_tests.py --root . \
            --minimum-tests ${{ matrix.minimum-tests }} \
            --minimum-executed ${{ matrix.minimum-executed }} \
            --require-module app \
            --require-module ssh/android \
            --require-module storage/android | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload UI test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-test-results-${{ matrix.name }}-${{ github.run_attempt }}
          path: |
            **/build/outputs/androidTest-results/connected/**
            **/build/reports/androidTests/connected/**
            build/reports/problems/**
          if-no-files-found: error
          retention-days: 14
