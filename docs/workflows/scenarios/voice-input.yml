id: voice-input
title: Capture and review offline voice input
summary: Turn speech into a draft locally, then let the user review it before any agent receives it.
status: verified
order: 9
verified_test: com.example.agentrelay.ui.main.UsageJourneyTest#capturesVerifiedJourneys
goal: Create session input hands-free without sending microphone data to a cloud service.
preconditions:
  - A compatible offline speech model is installed and verified.
  - Microphone permission was granted for an explicit recording action.
automatic:
  - Agent Relay records only during a visible foreground capture.
  - Offline transcription produces a session-local draft and preserves the existing cursor.
  - Model acquisition verifies size, digest, provenance, and available storage.
attention:
  - Start and stop recording explicitly.
  - Review and edit the transcript before sending or steering.
  - Approve a model download when no verified local model is available.
recovery:
  - Interrupted capture leaves the previous draft intact.
  - A failed model verification removes the unusable partial artifact.
  - Denied microphone permission keeps keyboard input fully usable.
steps:
  - id: acquire-model
    title: Prepare an offline model
    action: Select voice input when no compatible verified model is installed.
    expected: The app requires an explicit install for the selected offline model.
    screenshot: select-offline-model.png
    alt: Agent Relay offers explicit selection and installation of an offline speech model.
  - id: authorize-microphone
    title: Authorize an explicit recording
    action: Select Start voice input for the current session.
    expected: The app states that voice input stays on the device before Android handles microphone permission.
    screenshot: permission-gated-start.png
    alt: Agent Relay offers a permission-gated voice input action and states that input remains on the device.
  - id: record-locally
    title: Record with visible control
    action: Start recording, speak the instruction, and stop recording.
    expected: A foreground indicator remains visible and audio stays on the device.
    screenshot: visible-local-recording.png
    alt: Agent Relay visibly listens on device with explicit stop and cancel recording controls.
  - id: review-transcript
    title: Review before delivery
    action: Edit the generated draft and select Send or Steer active turn.
    expected: Only the reviewed text reaches the selected agent session.
    screenshot: review-transcript.png
    alt: Agent Relay presents an offline transcript with explicit use and discard actions before delivery.
