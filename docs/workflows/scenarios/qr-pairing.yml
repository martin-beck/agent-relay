id: qr-pairing
title: Pair the phone with a durable host
summary: Scan one host-generated QR code and establish an authenticated route when both devices share a network.
status: verified
verification_mode: synthetic-waiver
order: 8
goal: Pair two devices that are not directly reachable from the internet with minimal manual setup.
preconditions:
  - The phone and host can both reach the same LAN, public rendezvous service, or VPN.
  - The host daemon displays a short-lived, single-use pairing QR code.
  - A camera may open the same code as a verified HTTPS App Link.
automatic:
  - The QR payload carries rendezvous information, protocol versions, and a pinned host identity.
  - Both endpoints establish an encrypted channel and prove possession of their pairing keys.
  - Successful pairing rotates bootstrap material into durable device credentials.
  - Camera App Links and in-app scans use the same encrypted enrollment path.
attention:
  - Scan the QR code displayed by the intended host.
  - If the camera opens a link, confirm the daemon identity and requested scope in Agent Relay.
  - Compare the short authentication phrase on both devices when required.
  - Name the paired host and approve its requested capabilities.
recovery:
  - Expired or consumed QR payloads cannot be replayed.
  - A browser fallback never completes pairing and gives explicit return-to-app guidance.
  - Failed relay paths fall back to other advertised transports without weakening identity checks.
  - Removing a device revokes its durable credential without changing unrelated pairings.
steps:
  - id: display-host-code
    title: Display a short-lived host code
    action: Open pairing on the host daemon.
    expected: The synthetic host fixture shows a QR code, expiry, and a human-readable authentication phrase.
    screenshot: host-qr-display.png
    alt: >-
      Synthetic redacted host QR display showing a short-lived pairing code; not a real device capture.
  - id: scan-and-verify
    title: Scan and verify
    action: Scan the code in Agent Relay and compare the authentication phrase.
    expected: >-
      The synthetic app fixture shows both devices proving pinned identities before exchanging durable
      credentials.
    screenshot: app-confirmation.png
    alt: Synthetic redacted Agent Relay secure-pairing confirmation; not a real device capture.
  - id: camera-app-link
    title: Confirm a camera App Link
    action: Tap the camera preview link and review the verified daemon identity in Agent Relay.
    expected: >-
      The synthetic camera-link fixture shows the verified HTTPS path; Agent Relay rejects an
      unverified, expired or replayed link and otherwise enters the same confirmation and probe path.
    screenshot: camera-link-preview.png
    alt: Synthetic redacted camera link preview opening Agent Relay; not a real camera capture.
  - id: confirm-first-contact
    title: Confirm the paired host
    action: Name the host and approve the narrow capability set.
    expected: The synthetic fixture shows the host becoming available through the best shared-network route.
    screenshot: enrollment-complete.png
    alt: Synthetic redacted successful host enrollment result; not a real device capture.
  - id: reject-expired-link
    title: Reject an invalid or expired link
    action: Return to the QR flow after an expired or replayed link is detected.
    expected: Agent Relay rejects the link and explains that a new code is required.
    screenshot: expired-rejection.png
    alt: Synthetic redacted expired-link rejection state; not a real device capture.
verified_test: SyntheticQrWorkflowEvidence#reviewedFiveStates
