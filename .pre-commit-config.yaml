minimum_pre_commit_version: "4.6.2"
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-submodules
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace

  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: b0a550a82df22ed8bbc48156d3d6fa9bf20c975c  # frozen: v3.11.2
    hooks:
      - id: editorconfig-checker
        types: [text]
        files: \.(properties|xml)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 1f1e8bf348ff38fc88619a38d3ca4d9c56abea49  # frozen: v0.16.5
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^scripts/ci/.*\.py$
      - id: ruff-format
        types_or: [python, pyi]
        files: ^scripts/ci/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 7ff8d35ae36a7d2b968f2f90b4c723e292e594ee  # frozen: v2.3.1
    hooks:
      - id: mypy
        args: ["--config-file=pyproject.toml"]
        files: ^scripts/ci/.*\.py$

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: b82a6c8896e491b9cb377a99ff3412131920681b  # frozen: v0.23.2
    hooks:
      - id: markdownlint-cli2
        exclude: ^\.github/PULL_REQUEST_TEMPLATE\.md$

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: c4654a7e007c9619a5eb63c39a456572a0fa1851  # frozen: 0.38.0
    hooks:
      - id: check-dependabot
      - id: check-github-issue-config
      - id: check-github-issue-forms
      - id: check-github-workflows
      - id: check-github-workflows-require-timeout

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/lycheeverse/lychee
    rev: e85aaf5524b2f808e63bae55e594c843220f10f2  # frozen: lychee-v0.24.2
    hooks:
      - id: lychee
        alias: lychee-local
        name: Check local Markdown links
        args: ["LYCHEE_VERSION=0.24.2", "--offline", "--root-dir", ".", "--include-fragments", "--no-progress"]
        types: [markdown]
      - id: lychee
        alias: lychee-online
        name: Check all Markdown links
        args:
          - LYCHEE_VERSION=0.24.2
          - --root-dir
          - .
          - --include-fragments
          - --no-progress
          - --exclude
          - ^https://github\.com/martin-beck/agent-relay/(actions/workflows/verify\.yml(/badge\.svg)?|security/advisories/new)$
        types: [markdown]
        stages: [manual]

  - repo: https://github.com/crate-ci/typos
    rev: c8866b658f1eb6ff60473fee711ef5304c63f898  # frozen: v1.50.1
    hooks:
      - id: typos
        args: ["--force-exclude"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks dir --redact --verbose
        args: ["."]

  - repo: local
    hooks:
      - id: taplo-format
        name: Check TOML formatting with Taplo
        entry: taplo format
        language: node
        additional_dependencies: ["@taplo/cli@0.7.0"]
        types: [toml]
      - id: zizmor
        name: Audit GitHub Actions with zizmor
        entry: zizmor --offline
        language: python
        additional_dependencies: ["zizmor==1.30.0"]
        files: ^\.github/(dependabot\.ya?ml|workflows/.*\.ya?ml)$
        types: [yaml]
